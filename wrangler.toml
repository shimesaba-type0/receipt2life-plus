# 値はプレースホルダーのみ。アカウントID・D1のID・ドメインなどは書かない(docs/setup.md)
# D1は database_id を書かない。デプロイ時にWranglerの自動プロビジョニングで解決する想定(要確認)
name = "receipt2life"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

# ダッシュボードで設定した変数を、デプロイで上書きして消さない
keep_vars = true

# ログ(認証で弾いた理由など)をダッシュボードの Observability で見られるようにする
[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "receipt2life"
migrations_dir = "migrations"

# 写真の保存先。公開しない。バケットは、デプロイ時の自動プロビジョニングで作る想定(要確認)
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "receipt2life"

# Web UI(ui/dist)。run_worker_first = true で、静的ファイルも必ずWorker(認証)を通す
[assets]
directory = "ui/dist"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"

[env.staging]
name = "receipt2life-staging"
workers_dev = false
preview_urls = false

[[env.staging.d1_databases]]
binding = "DB"
database_name = "receipt2life-staging"
migrations_dir = "migrations"

[[env.staging.r2_buckets]]
binding = "PHOTOS"
bucket_name = "receipt2life-staging"

[env.staging.assets]
directory = "ui/dist"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"
