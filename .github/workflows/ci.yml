name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # PRでもmainでも必ずテストする
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  # PR: テストが通ったらステージング(開発環境)へデプロイ
  # 変数 CLOUDFLARE_STAGING_DEPLOY_ENABLED=true を設定するまでは動かない(docs/ci-cd.md)。
  # 本番用の CLOUDFLARE_DEPLOY_ENABLED とは別にしてある(本番は Cloudflare 側の自動デプロイが行うので、ステージングだけを有効にできるように)
  deploy-staging:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.CLOUDFLARE_STAGING_DEPLOY_ENABLED == 'true'
    needs: test
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Web UI(ui/dist)をビルドする。ui/dist は git に入れていないので、ここで作らないと、画面のファイルが空のままデプロイされる。
      # VITE_STAGING_LABEL を渡すと、画面の上に「STAGING・PR #番号」の帯が出る(本番のビルドには渡さない)
      # run: に直接書くと、YAML が「 #」以降をコメントとして切ってしまうので、ブロック形式で書く
      - run: |
          VITE_STAGING_LABEL="PR #${PR_NUMBER} · ${HEAD_SHA:0:7}" npm run build
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      # デプロイの直前にD1のマイグレーションを当てる(Cloudflare側のデプロイコマンドと揃える)
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply DB --remote --env staging
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env staging

  # main: テストが通ったら本番へデプロイ
  deploy-production:
    if: >-
      github.event_name == 'push' &&
      vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    needs: test
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Web UI(ui/dist)をビルドする(帯の変数 VITE_STAGING_LABEL は渡さない。本番には目印の帯を出さない)
      - run: npm run build
      # デプロイの直前にD1のマイグレーションを当てる(Cloudflare側のデプロイコマンドと揃える)
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply DB --remote
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
